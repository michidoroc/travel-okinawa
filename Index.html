const defs=[[[0,'공항','airport'],[1,'사키마 미술관','museum'],[2,'숙소','hotel'],[3,'유난기','food'],[4,'블루씰','ice'],[5,'파커스 무드','jazz']],[[1,'현청 앞','office'],[2,'평화기념공원','memorial'],[3,'히메유리 자료관','museum'],[4,'아라사키 해안','coast'],[5,'간가라 계곡','forest'],[6,'숙소','hotel'],[7,'후쿠슈엔','garden'],[8,'코우','food']],[[0,'숙소','hotel'],[1,'오키나와대학','university'],[7,'시마우타','music']],[[0,'숙소','hotel'],[1,'guma guwa','pottery'],[2,'이쿠토엔','pottery'],[3,'nan*ne','food'],[5,'겐초마에역','station'],[7,'나하공항','airport']]];
const titles=['01  기억과 재즈의 밤','02  남쪽으로, 기억의 길','03  생각을 나누고 노래를 듣다','04  그릇 하나, 여행의 여운'];
const subtitles=['9월 11일 금요일 · 14:00 도착 / 21:00 재즈','9월 12일 토요일 · 09:00-18:00 답사 / 나하의 저녁','9월 13일 일요일 · 10:00 콜로키움 / 네네즈 공연','9월 14일 월요일 · 쓰보야 도자기거리 / 15:00 출국'];
const types={airport:'ARRIVAL & DEPARTURE',museum:'ART & MEMORY',hotel:'YOUR LITTLE BASE',food:'LOCAL TABLE',ice:'SWEET BREAK',jazz:'JAZZ AT NIGHT',office:'MEETING POINT',memorial:'PEACE & REMEMBRANCE',coast:'SOUTHERN COAST',forest:'FOREST WALK',garden:'GARDEN AT DUSK',university:'COLLOQUIUM',music:'OKINAWAN VOICES',pottery:'CRAFT & CLAY',station:'YUI RAIL'};
let day=0,selected=0,done={};try{done=JSON.parse(localStorage.getItem('okinawa-world-checks')||'{}')}catch{}let autoplay=null;
const C=$('world'),ctx=C.getContext('2d');let W=0,H=0,mobile=false,angle=-.55,targetAngle=-.55,zoom=1,targetZoom=1,focus={x:0,y:0},targetFocus={x:0,y:0},pois=[],buildings=[],trees=[],particles=[],frame=0;
function rand(n){const x=Math.sin(n*127.1+day*58.3)*43758.5453;return x-Math.floor(x)}
function project(x,y,z=0){x-=focus.x;y-=focus.y;const a=x*Math.cos(angle)-y*Math.sin(angle),b=x*Math.sin(angle)+y*Math.cos(angle);let scale=(mobile?Math.min(W/870,.60):Math.min(W/1500,1.1))*zoom;return {x:(mobile?W*.5:W*.43)+a*scale,y:(mobile?420:H*.54)+b*.51*scale-z*scale,s:scale,depth:b};}
function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>{const q=project(...p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.5;ctx.stroke()}}
function box(x,y,w,d,h,color='#eee8d4',z=0){const a=[x-w/2,y-d/2],b=[x+w/2,y-d/2],c=[x+w/2,y+d/2],e=[x-w/2,y+d/2];const faces=[[a,b],[b,c],[c,e],[e,a]].map((v,i)=>({v,i,depth:project((v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2).depth})).sort((a,b)=>a.depth-b.depth);faces.forEach(({v,i})=>{poly([[...v[0],z],[...v[1],z],[...v[1],z+h],[...v[0],z+h]],i%2?shade(color,-22):shade(color,-10))});poly([[...a,z+h],[...b,z+h],[...c,z+h],[...e,z+h]],color)}
function shade(hex,n){let a=hex.replace('#','');return '#'+[0,2,4].map(i=>Math.max(0,Math.min(255,parseInt(a.slice(i,i+2),16)+n)).toString(16).padStart(2,'0')).join('')}
function line(points,color,width,dash=[]){ctx.beginPath();points.forEach((v,i)=>{const p=project(...v);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.strokeStyle=color;ctx.lineWidth=width*project(0,0).s;ctx.setLineDash(dash);ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])}
function roof(x,y,w,d,z){box(x,y,w+10,d+10,8,'#d99465',z);for(let i=-d/2;i<d/2;i+=10)line([[x-w/2,y+i,z+9],[x+w/2,y+i,z+9]],'#ebb181',2)}
function tree(x,y,size=1){box(x,y,5,5,30*size,'#bc946b');box(x,y,31*size,29*size,17*size,'#96b28b',25*size);box(x+4,y,23*size,23*size,14*size,'#acc699',39*size)}
function building(b){const {x,y,w,d,h,kind}=b;let col=kind==='jazz'?'#42575b':kind==='music'?'#d3b589':'#f4ecd8';box(x,y,w+14,d+14,7,'#ddd8c1');if(kind==='coast'){box(x,y,100,65,7,'#dbd1af');for(let i=0;i<5;i++)box(x-40+i*22,y+13,18,23,14+rand(i)*14,'#b3b9a4');return}if(kind==='forest'){for(let i=0;i<7;i++)tree(x+(rand(i)-.5)*100,y+(rand(i+8)-.5)*80,1.1+rand(i));box(x,y,46,33,20,'#887e66');return}if(kind==='garden'){box(x,y,100,85,5,'#a8cbb6');box(x,y,63,45,4,'#95cbd0',6);for(let i=-1;i<=1;i+=2){box(x+i*45,y,16,40,38,'#e9d5b2');roof(x+i*45,y,30,50,38)}return}if(kind==='memorial'){box(x,y,100,80,8,'#c6cbb6');box(x,y,15,15,92,'#efecdf',8);box(x,y,32,32,10,'#fff7df',98);for(let i=0;i<5;i++)box(x-48+i*24,y+45,17,12,18,'#9ba9a0');return}box(x,y,w,d,h,col,7);if(kind==='airport'){box(x,y,150,25,22,'#a0c5c3',h);box(x+50,y-25,14,14,65,'#e8e4d2');box(x+50,y-25,32,25,15,'#78999c',65);box(x,y+55,80,8,6,'#faf8ed',10);box(x,y+55,12,60,6,'#faf8ed',10)}else if(kind==='station'){box(x,y,w+14,d+10,9,'#89bbb4',h+7);box(x,y+40,115,18,20,'#e7ede6');box(x,y+40,105,19,5,'#dc8770',10)}else if(kind==='museum'||kind==='university'){box(x,y,w+18,d+14,11,'#e4deca',h+7);for(let i=-1;i<=1;i++)box(x+i*w*.28,y+d/2+4,7,8,h-4,'#fcf6e3',7)}else roof(x,y,w,d,h+7);
for(let i=-1;i<=1;i++)box(x+i*w*.26,y+d/2+.6,w*.12,2,12,kind==='jazz'?'#e9c17d':'#83a9a7',h*.5);box(x,y+d/2+1,13,3,24,'#738f85',7);
if(kind==='pottery'){for(let i=0;i<3;i++){box(x-25+i*23,y+d/2+15,12,12,14,'#c9906c');box(x-25+i*23,y+d/2+15,8,8,5,'#e4bc85',14)}}if(kind==='ice'){box(x+30,y,20,20,25,'#ddb28a',h+10);box(x+30,y,29,29,20,'#c4bdde',h+34)}if(kind==='jazz'||kind==='music'){box(x,y+d/2+5,w*.72,5,14,'#36585a',h-14)}}
function setup(){const n=defs[day].length;pois=defs[day].map((d,i)=>{let a=(i/n)*Math.PI*2-.9;return {x:Math.cos(a)*300,y:Math.sin(a)*220,w:d[2]==='airport'?110:80,d:65,h:d[2]==='hotel'?95:d[2]==='university'?70:50,kind:d[2],name:d[1],row:trip.days[day].rows[d[0]],i}});buildings=[];for(let i=0;i<55;i++){let x=(rand(i+201)-.5)*1020,y=(rand(i+371)-.5)*800;if(pois.some(p=>Math.hypot(p.x-x,p.y-y)<125)||Math.abs(y)<25)continue;buildings.push({x,y,w:25+rand(i+1)*27,d:25+rand(i+4)*26,h:20+rand(i+9)*45,kind:'house'})}trees=[];for(let i=0;i<24;i++){let x=(rand(i+503)-.5)*1000,y=(rand(i+605)-.5)*780;if(!pois.some(p=>Math.hypot(p.x-x,p.y-y)<65))trees.push({x,y})}$('pins').innerHTML=pois.map((p,i)=>`<button class="pin" data-i="${i}"><span>${String(i+1).padStart(2,'0')}</span>${p.name}</button>`).join('');$('pins').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('daytitle').textContent=titles[day];$('daysub').textContent=subtitles[day];$('chapter').textContent=['미술관에서 재즈클럽까지','평화와 기억을 따라 걷는 하루','낮의 이야기, 밤의 노래','도자기 거리에서 공항까지'][day];document.querySelectorAll('.footer button').forEach((b,i)=>b.classList.toggle('active',i===day));choose(0,false);targetFocus={x:0,y:0};targetZoom=1;}
function choose(i,move=true){selected=(i+pois.length)%pois.length;const p=pois[selected];$('kind').textContent=types[p.kind];$('detailtime').textContent='9/'+(11+day)+' · '+p.row.time;$('place').textContent=p.name;$('desc').textContent=p.row.note||p.row.title;let url=p.row.url||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.kind==='hotel'?'コンフォートホテル那覇県庁前':p.kind==='airport'?'那覇空港':p.name+' 沖縄');$('maps').href=url;$('count').textContent=(selected+1)+' / '+pois.length+' 장소';$('warn').textContent=trip.days[day].warning;refresh();if(move){targetFocus={x:p.x*.58,y:p.y*.58};targetZoom=1.15}}
function refresh(){const key=day+'-'+selected;$('check').textContent=done[key]?'✓ 방문 완료 · 눌러 취소':'방문 완료 표시';$('check').setAttribute('aria-pressed',!!done[key]);let n=pois.filter((p,i)=>done[day+'-'+i]).length;$('progress').textContent=`오늘의 여행 기록 ${n} / ${pois.length}`;$('fill').style.width=(100*n/pois.length)+'%';document.querySelectorAll('.pin').forEach((b,i)=>{b.classList.toggle('selected',i===selected);b.classList.toggle('done',!!done[day+'-'+i]);b.setAttribute('aria-pressed',i===selected)})}
function resize(){mobile=innerWidth<=800;W=C.clientWidth;H=C.clientHeight;let d=Math.min(devicePixelRatio||1,2);C.width=W*d;C.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
function draw(){frame++;angle+=(targetAngle-angle)*.08;zoom+=(targetZoom-zoom)*.09;focus.x+=(targetFocus.x-focus.x)*.08;focus.y+=(targetFocus.y-focus.y)*.08;ctx.fillStyle='#bcded8';ctx.fillRect(0,0,W,H);for(let i=0;i<30;i++){const x=rand(i+900)*W,y=(mobile?260:0)+rand(i+990)*(mobile?350:H);ctx.fillStyle='#e0eee344';ctx.fillRect(x+Math.sin(frame*.007+i)*8,y,15+rand(i)*20,2)}box(0,0,1160,910,28,'#b7baa2',-32);poly([[-580,-455,0],[580,-455,0],[580,455,0],[-580,455,0]],'#e5e2c9');for(let i=-400;i<=400;i+=160){line([[-550,i,1],[550,i,1]],'#f6f1dd',25);line([[i,-440,1],[i,440,1]],'#f6f1dd',22)}let r=pois.map(p=>[p.x,p.y,3]);r.push(r[0]);line(r,'#f7f5e9',30);line(r,'#d1a473',2,[4,7]);const ground=pois.map(p=>({p,depth:project(p.x,p.y).depth}));let all=[...buildings.map(b=>({b,depth:project(b.x,b.y).depth})),...pois.map(b=>({b,depth:project(b.x,b.y).depth})),...trees.map(t=>({t,depth:project(t.x,t.y).depth}))].sort((a,b)=>a.depth-b.depth);all.forEach(o=>o.t?tree(o.t.x,o.t.y,.8):building(o.b));const q=pois[selected],pt=project(q.x,q.y+q.d/2+24,12);ctx.fillStyle='#fff6dc';ctx.beginPath();ctx.ellipse(pt.x,pt.y+10*pt.s,11*pt.s,5*pt.s,0,0,Math.PI*2);ctx.fill();box(q.x,q.y+q.d/2+24,9,9,18,'#cc795b',6);box(q.x,q.y+q.d/2+24,12,12,12,'#ecd1a5',24);
pois.forEach((p,i)=>{const q=project(p.x,p.y,p.kind==='memorial'?120:p.h+32),b=$('pins').children[i];b.style.left=q.x+'px';b.style.top=q.y+'px';b.style.visibility=mobile&&(q.y<280||q.y>575)?'hidden':'visible'});requestAnimationFrame(draw)}
$('check').onclick=()=>{const k=day+'-'+selected;done[k]=!done[k];try{localStorage.setItem('okinawa-world-checks',JSON.stringify(done))}catch{}refresh()};$('prev').onclick=()=>choose(selected-1);$('next').onclick=()=>choose(selected+1);$('zoomout').onclick=()=>targetZoom=Math.max(.65,targetZoom-.2);$('zoomin').onclick=()=>targetZoom=Math.min(2.2,targetZoom+.2);$('reset').onclick=()=>{targetFocus={x:0,y:0};targetZoom=1;targetAngle=-.55};let drag=null;C.onpointerdown=e=>{drag={x:e.clientX};C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(drag){targetAngle+=(e.clientX-drag.x)*.007;drag.x=e.clientX}};C.onpointerup=C.onpointercancel=()=>drag=null;C.addEventListener('wheel',e=>{e.preventDefault();targetZoom=Math.max(.65,Math.min(2.2,targetZoom-e.deltaY*.001))},{passive:false});
function stopTour(){clearInterval(autoplay);autoplay=null;$('tour').textContent='▶ 자동 산책'}$('tour').onclick=()=>{if(autoplay)return stopTour();$('tour').textContent='Ⅱ 산책 멈춤';choose(selected);autoplay=setInterval(()=>{if(selected===pois.length-1){stopTour();return}choose(selected+1)},4200)};
const nav=document.querySelector('.footer');nav.innerHTML=['기억과 재즈','남부 답사','콜로키움','도자기 산책'].map((s,i)=>`<button>9.${11+i}<small>${s}</small></button>`).join('');nav.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{stopTour();day=i;setup()});
function openModal(title,html){$('modaltitle').textContent=title;$('modalbody').innerHTML=html;$('modal').showModal()};$('schedule').onclick=()=>openModal('9월 11-14일 · 전체 일정',trip.days.map((d,i)=>`<h2>${d.title}</h2><table>${d.rows.map(r=>`<tr><th>${r.time}</th><td><b>${r.title}</b><p>${r.note}</p></td></tr>`).join('')}</table><p>${d.warning}</p><p><a href="${d.route}" target="_blank" rel="noopener">이날 전체 길찾기 ↗</a></p>`).join(''));$('program').onclick=()=>openModal('미술관·학술행사 안내',trip.program);$('close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').close()};document.addEventListener('keydown',e=>{if($('modal').open)return;if(e.key==='ArrowRight')choose(selected+1);if(e.key==='ArrowLeft')choose(selected-1)});addEventListener('resize',resize);resize();setup();draw();$('loading').remove();
</script></body></html>
